<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex, nofollow">
<title>SITAX ADMIN</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="app" id="adminApp">
  <header class="header">
    <div class="logo"><span class="logo-nova">SITAX</span> <span class="logo-shop">ADMIN</span></div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out">
        <svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
      </button>
    </div>
  </header>

  <div class="chips tabs" id="tabs">
    <button class="chip active" data-tab="dashboard">Dashboard</button>
    <button class="chip" data-tab="orders">Orders</button>
    <button class="chip" data-tab="products">Products</button>
    <button class="chip" data-tab="coupons">Coupons</button>
  </div>

  <main id="adminMain"></main>
</div>

<section class="sheet" id="adSheet"></section>
<div class="toast" id="toast"></div>

<!-- Admin login -->
<section class="auth" id="adLogin">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <div class="auth-inner">
    <div class="auth-logo"><span class="auth-nova">SITAX</span> <span class="auth-shop">ADMIN</span></div>
    <p class="auth-tag">Shop owner sign in</p>
    <div class="auth-card" id="adCard">
      <div class="field">
        <input id="adEmail" type="email" placeholder=" " autocomplete="email">
        <label for="adEmail">Email</label>
      </div>
      <div class="field">
        <input id="adPass" type="password" placeholder=" " autocomplete="current-password">
        <label for="adPass">Password</label>
      </div>
      <p class="auth-error" id="adError"></p>
      <button class="btn-gold" id="adSubmit"><span class="btn-text">SIGN IN</span><span class="spinner"></span></button>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
